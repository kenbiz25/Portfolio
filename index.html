<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="WLbf4EhchvC9TbbxbBhi029ztornng12n48_8JKtUrc" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />

    <!-- Apply saved / system theme before first paint (no light flash in dark mode) -->
    <script>
      try {
        var t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.classList.add(t);
      } catch (e) {}
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" /></noscript>

    <!-- SEO Core (pages override these at runtime and at prerender time) -->
    <title>Keneth Kiplagat | Technology & AI Operations · Technical Program Management</title>
    <meta
      name="description"
      content="Keneth Kiplagat leads technical delivery for multi-country digital health programs, coordinating technical teams, field operations, and donor stakeholders so platforms get adopted and actually work."
    />
    <meta name="author" content="Keneth Kiplagat" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.kenkiplagat.co.ke/" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-readable summary" />

    <!-- Open Graph -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Keneth Kiplagat" />
    <meta property="og:locale" content="en_KE" />
    <meta property="og:title" content="Keneth Kiplagat | Technology & AI Operations · Technical Program Management" />
    <meta
      property="og:description"
      content="Making technology work in the real world. Keneth Kiplagat leads technical delivery for multi-country digital health programs across Bangladesh, Kenya, Ghana, and Sierra Leone."
    />
    <meta property="og:url" content="https://www.kenkiplagat.co.ke/" />
    <meta property="og:image" content="https://www.kenkiplagat.co.ke/img/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Kenbiz25Keneth" />
    <meta name="twitter:title" content="Keneth Kiplagat | Technology & AI Operations · Technical Program Management" />
    <meta
      name="twitter:description"
      content="Making technology work in the real world: technical delivery for multi-country digital health programs."
    />
    <meta name="twitter:image" content="https://www.kenkiplagat.co.ke/img/og.jpg" />

    <!--
      Google Tag Manager + AdSense, deferred so they don't block first paint.
      GTM loads on first interaction or 5s after load; AdSense only on interaction.
    -->
    <script>
      (function () {
        var gtmLoaded = false, adsLoaded = false;
        function loadGtm() {
          if (gtmLoaded) return; gtmLoaded = true;
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
          var s = document.createElement("script");
          s.async = true; s.src = "https://www.googletagmanager.com/gtm.js?id=GTM-MDD9NJK8";
          document.head.appendChild(s);
        }
        function loadAds() {
          if (adsLoaded) return; adsLoaded = true;
          var s = document.createElement("script");
          s.async = true; s.crossOrigin = "anonymous";
          s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8787623516632800";
          document.head.appendChild(s);
        }
        var events = ["scroll", "pointerdown", "keydown", "touchstart"];
        function onInteract() {
          events.forEach(function (e) { removeEventListener(e, onInteract); });
          loadGtm(); loadAds();
        }
        events.forEach(function (e) { addEventListener(e, onInteract, { passive: true, once: true }); });
        addEventListener("load", function () { setTimeout(loadGtm, 5000); });
      })();
    </script>
  </head>

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-MDD9NJK8"
        height="0"
        width="0"
        style="display:none;visibility:hidden"
        title="Google Tag Manager">
      </iframe>
    </noscript>

    <div id="root"></div>

    <!-- App Entry -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
